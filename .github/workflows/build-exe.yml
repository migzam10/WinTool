name: Build WinTool EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build WinTool.exe (Release)
        run: dotnet build WinTool.csproj -c Release -o dist

      - name: Upload WinTool.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinTool
          path: dist/WinTool.exe
          if-no-files-found: error

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WinTool.exe
          generate_release_notes: true
